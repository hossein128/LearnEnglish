<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انگلیسی برای فارسی‌زبانان | English for Persian Speakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5fb; --surface:#fff; --surface-2:#f8fafc; --border:#e4e9f4;
  --text:#141827; --muted:#69738f; --accent:#4f46e5; --accent-soft:#eef0ff;
  --accent-2:#0ea5e9; --success:#0f9d76; --success-soft:#e6f7f1;
  --danger:#e5484d; --danger-soft:#fdecec; --warn:#f59e0b;
  --radius:18px; --shadow:0 4px 20px rgba(20,24,39,.06);
  --shadow-lg:0 14px 44px rgba(20,24,39,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.85;font-size:15px;min-height:100vh;
  background-image:radial-gradient(circle at 12% -10%,#e5e9ff 0,transparent 45%),
                   radial-gradient(circle at 92% 0%,#e0f5ff 0,transparent 40%);
  background-attachment:fixed;
}
.en{font-family:'Inter',system-ui,sans-serif;direction:ltr;unicode-bidi:isolate;font-weight:500}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.shell{max-width:940px;margin:0 auto;padding:0 16px 120px}

header.top{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(242,245,251,.85);border-bottom:1px solid var(--border);
  margin:0 -16px 18px;padding:12px 16px 10px;
}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand .logo{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-family:'Inter';font-size:16px;font-weight:700;
  box-shadow:0 6px 16px rgba(79,70,229,.32)
}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1.3}
.levels{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.chip{
  padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:700;
  border:1.5px solid var(--border);background:var(--surface);color:var(--muted);
  transition:.18s;font-family:'Inter'
}
.chip:hover{border-color:#c7cdf0;color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(79,70,229,.28)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  padding:7px 12px;border-radius:11px;font-size:13px;font-weight:600;
  color:var(--muted);transition:.16s
}
nav.tabs button:hover{background:#e9edf8;color:var(--text)}
nav.tabs button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
nav.tabs .ic{font-size:15px;line-height:1}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
h2.sec{font-size:19px;font-weight:800;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:13px;font-weight:700;font-size:14.5px;
  background:var(--accent);color:#fff;transition:.16s;box-shadow:0 6px 18px rgba(79,70,229,.26)}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(79,70,229,.34)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--surface);color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn.ghost:hover{border-color:#c7cdf0;box-shadow:var(--shadow)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11.5px;
  font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.green{background:var(--success-soft);color:var(--success)}
.pill.gray{background:#eef1f7;color:var(--muted)}

.hero{background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;border:none;
  border-radius:22px;padding:30px 26px;margin-bottom:16px;box-shadow:0 18px 46px rgba(79,70,229,.3);
  position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset-inline-end:-60px;top:-60px;width:220px;height:220px;
  border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:25px;font-weight:800;line-height:1.5;margin-bottom:6px;position:relative}
.hero p{opacity:.92;font-size:14px;position:relative;max-width:600px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:800;font-family:'Inter';color:var(--accent);line-height:1.3}
.stat span{font-size:12.5px;color:var(--muted)}

.bar{height:7px;border-radius:99px;background:#eaeef8;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s cubic-bezier(.4,0,.2,1)}

.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:190px;padding:11px 15px;border-radius:13px;border:1.5px solid var(--border);
  background:var(--surface);font-size:14px;outline:none;transition:.16s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}

.word{background:var(--surface);border:1px solid var(--border);border-radius:15px;
  padding:15px 17px;margin-bottom:10px;box-shadow:var(--shadow);transition:.18s}
.word:hover{border-color:#cfd5ee;box-shadow:var(--shadow-lg)}
.word.done{background:linear-gradient(90deg,var(--success-soft),var(--surface) 40%)}
.word-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.word-en{font-family:'Inter';font-size:19px;font-weight:700;direction:ltr;letter-spacing:-.2px}
.word-pr{font-size:12px;color:var(--muted);background:var(--surface-2);padding:2px 9px;border-radius:8px;border:1px solid var(--border)}
.word-fa{font-size:16px;font-weight:700;color:var(--accent);margin-inline-start:auto}
.spk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:15px;transition:.16s;flex-shrink:0}
.spk:hover{background:var(--accent);color:#fff}
.spk.sm{width:28px;height:28px;font-size:13px;border-radius:9px}
.word-ex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);
  font-size:13.5px;color:var(--muted)}
.word-ex .en{color:var(--text);font-weight:500}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
  font-weight:600;margin-top:10px;cursor:pointer;user-select:none;width:fit-content}
.chk input{width:17px;height:17px;accent-color:var(--success);cursor:pointer}

.acc{background:var(--surface);border:1px solid var(--border);border-radius:15px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.acc-h{display:flex;align-items:center;gap:11px;padding:15px 17px;width:100%;text-align:right;font-weight:700;font-size:15px;transition:.15s}
.acc-h:hover{background:var(--surface-2)}
.acc-h .num{width:27px;height:27px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-family:'Inter';font-size:12.5px;font-weight:700;flex-shrink:0}
.acc-h .arw{margin-inline-start:auto;color:var(--muted);font-size:12px;transition:.25s}
.acc.open .arw{transform:rotate(180deg)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.acc.open .acc-b{max-height:3000px}
.acc-inner{padding:0 17px 18px;border-top:1px solid var(--border);padding-top:14px;font-size:14px}
.acc-inner p{margin-bottom:10px}
.acc-inner ul{margin:0 18px 12px 0;padding-inline-start:14px}
.acc-inner li{margin-bottom:6px}
.eg{background:var(--surface-2);border-inline-start:3px solid var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.eg .en{font-weight:600;display:block;direction:ltr;text-align:left}
.eg .fa{color:var(--muted);font-size:13px}
.warn-box{background:#fff8ec;border:1px solid #f7e0b8;border-radius:12px;padding:11px 14px;font-size:13.5px;margin:10px 0;color:#8a5a00}
.ok-box{background:var(--success-soft);border:1px solid #bfe8da;border-radius:12px;padding:11px 14px;font-size:13.5px;margin:10px 0;color:#0a6b51}

.fc-stage{perspective:1400px;margin-bottom:16px}
.fc{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px;text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.fc-front{background:var(--surface)}
.fc-back{background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff;transform:rotateY(180deg);border:none}
.fc-front .big{font-family:'Inter';font-size:38px;font-weight:700;direction:ltr;letter-spacing:-1px;margin-bottom:8px}
.fc-front .pr{color:var(--muted);font-size:14px}
.fc-front .hint{position:absolute;bottom:18px;font-size:12px;color:#aab3c9}
.fc-back .big{font-size:27px;font-weight:800;margin-bottom:10px}
.fc-back .ex{font-size:14px;opacity:.94;max-width:440px}
.fc-back .ex .en{display:block;font-weight:600;margin-bottom:3px}
.fc-back .spk2{position:absolute;top:16px;inset-inline-end:16px;width:38px;height:38px;border-radius:12px;
  background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;font-size:16px}
.fc-back .spk2:hover{background:rgba(255,255,255,.36)}
.fc-controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.fc-controls .btn{flex:1;min-width:90px;max-width:170px}
.grade-again{background:#fff;color:var(--danger);border:1.5px solid #f6c9cb;box-shadow:none}
.grade-again:hover{background:var(--danger-soft)}
.grade-good{background:#fff;color:var(--warn);border:1.5px solid #f5d99b;box-shadow:none}
.grade-good:hover{background:#fff8ec}
.grade-easy{background:#fff;color:var(--success);border:1.5px solid #b6e5d4;box-shadow:none}
.grade-easy:hover{background:var(--success-soft)}
.fc-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600;flex-wrap:wrap;gap:6px}

.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13.5px;color:var(--muted);font-weight:600}
.q-text{font-size:19px;font-weight:700;margin-bottom:20px;line-height:1.7}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;
  padding:14px 17px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--surface);margin-bottom:10px;font-size:15.5px;font-weight:600;
  transition:.16s;box-shadow:var(--shadow)}
.opt:hover:not(.locked){border-color:var(--accent);background:var(--accent-soft);transform:translateX(-3px)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;font-family:'Inter';font-size:12.5px;font-weight:700;color:var(--muted);flex-shrink:0}
.opt.correct{background:var(--success-soft);border-color:#9ddcc4}
.opt.correct .k{background:var(--success);color:#fff;border-color:var(--success)}
.opt.wrong{background:var(--danger-soft);border-color:#f3bfc1}
.opt.wrong .k{background:var(--danger);color:#fff;border-color:var(--danger)}
.opt.locked{cursor:default}
.feedback{border-radius:14px;padding:14px 17px;margin-top:6px;font-weight:700;font-size:14.5px;display:flex;gap:9px;align-items:center}
.feedback.ok{background:var(--success-soft);color:#0a6b51}
.feedback.no{background:var(--danger-soft);color:#a32b2f}
.result-hero{text-align:center;padding:34px 20px}
.result-hero .score{font-family:'Inter';font-size:58px;font-weight:800;line-height:1.1;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.result-hero .msg{font-size:17px;font-weight:700;margin:10px 0 4px}
.progress-line{height:7px;background:#eaeef8;border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s}

.snd{padding:0;overflow:hidden}
.ipa{font-family:'Inter';font-size:22px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:3px 14px;border-radius:11px;direction:ltr}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-top:12px}
.pair{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:10px 13px;font-size:14px}
.pair .w{font-family:'Inter';font-weight:600;direction:ltr;cursor:pointer;padding:2px 6px;border-radius:7px;transition:.15s}
.pair .w:hover{background:var(--accent);color:#fff}
.pair .vs{color:#c3cade;font-size:11px}
.pair .gloss{font-size:11.5px;color:var(--muted);margin-inline-start:auto;text-align:left;direction:rtl}

.pgrid{display:grid;gap:12px}
.prow{display:flex;align-items:center;gap:13px}
.prow .lbl{font-family:'Inter';font-weight:700;font-size:14px;width:34px;color:var(--muted)}
.prow .bar{flex:1;margin-top:0}
.prow .val{font-family:'Inter';font-size:13px;font-weight:700;color:var(--muted);width:44px;text-align:left}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .em{font-size:40px;margin-bottom:12px;opacity:.6}

.toast{position:fixed;bottom:26px;inset-inline-start:50%;transform:translateX(50%) translateY(90px);
  background:#141827;color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;font-weight:600;
  box-shadow:0 14px 40px rgba(0,0,0,.28);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:200;pointer-events:none}
.toast.show{transform:translateX(50%) translateY(0)}

/* Conversations */
.convo{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;
  box-shadow:var(--shadow);overflow:hidden;transition:.18s}
.convo:hover{box-shadow:var(--shadow-lg)}
.convo-h{padding:15px 18px;cursor:pointer;display:flex;align-items:center;gap:12px}
.convo-h .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:18px;flex-shrink:0}
.convo-h .txt{flex:1;min-width:0}
.convo-h b{font-size:15px;display:block}
.convo-h small{font-size:12.5px;color:var(--muted)}
.convo-h .arw{color:var(--muted);transition:.25s}
.convo.open .convo-h .arw{transform:rotate(180deg)}
.convo-b{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1)}
.convo.open .convo-b{max-height:2600px}
.convo-inner{padding:0 18px 18px;border-top:1px solid var(--border);padding-top:14px}
.convo-tools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.line{display:flex;gap:11px;margin-bottom:13px;align-items:flex-start}
.line .who{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font-family:'Inter';font-weight:700;font-size:13px;flex-shrink:0;color:#fff}
.line.a .who{background:linear-gradient(135deg,#4f46e5,#6366f1)}
.line.b .who{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
.line .body{flex:1;min-width:0}
.line .en-line{font-family:'Inter';font-size:15px;font-weight:600;direction:ltr;text-align:left;line-height:1.6;
  display:flex;align-items:flex-start;gap:8px}
.line .en-line span{flex:1}
.line .fa-line{font-size:13px;color:var(--muted);margin-top:3px}
.line .spk-line{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:13px;flex-shrink:0;transition:.15s}
.line .spk-line:hover{background:var(--accent);color:#fff}

@media(max-width:640px){
  body{font-size:14.5px}
  .hero h1{font-size:21px}
  .fc-front .big{font-size:30px}
  .word-fa{margin-inline-start:0;width:100%}
  .levels{width:100%;margin-inline-start:0}
  .chip{flex:1;text-align:center;padding:7px 4px}
  .brand small{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <div class="logo">En</div>
      <div>انگلیسی برای فارسی‌زبانان<small>English for Persian Speakers</small></div>
    </div>
    <div class="levels" id="levels"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main class="shell" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. LEVELS
   ============================================================ */
const LEVELS = ['A1','A2','B1','B2','C1'];
const LEVEL_NAMES = {A1:'مبتدی',A2:'پایه',B1:'متوسط',B2:'متوسط بالا',C1:'پیشرفته'};

/* ============================================================
   2. VOCABULARY (level-based basics)
   ============================================================ */
const VOCAB = {
A1:[
 {en:'hello',fa:'سلام',pr:'هِلو',ex:'Hello! How are you?',exFa:'سلام! حال شما چطور است؟'},
 {en:'goodbye',fa:'خداحافظ',pr:'گودبای',ex:'Goodbye! See you tomorrow.',exFa:'خداحافظ! فردا می‌بینمت.'},
 {en:'thank you',fa:'متشکرم',pr:'ثَنک یو',ex:'Thank you for your help.',exFa:'از کمکت متشکرم.'},
 {en:'please',fa:'لطفاً',pr:'پلیز',ex:'Please sit down.',exFa:'لطفاً بنشین.'},
 {en:'yes',fa:'بله',pr:'یِس',ex:'Yes, I understand.',exFa:'بله، متوجه شدم.'},
 {en:'no',fa:'نه',pr:'نو',ex:'No, thank you.',exFa:'نه، متشکرم.'},
 {en:'sorry',fa:'ببخشید، متأسفم',pr:'ساری',ex:'Sorry, I am late.',exFa:'ببخشید، دیر کردم.'},
 {en:'excuse me',fa:'ببخشید (برای جلب توجه)',pr:'اِکسکیوز می',ex:'Excuse me, where is the station?',exFa:'ببخشید، ایستگاه کجاست؟'},
 {en:'water',fa:'آب',pr:'واوْتِر',ex:'I drink water every day.',exFa:'من هر روز آب می‌نوشم.'},
 {en:'bread',fa:'نان',pr:'برِد',ex:'We buy bread in the morning.',exFa:'ما صبح نان می‌خریم.'},
 {en:'tea',fa:'چای',pr:'تی',ex:'She drinks tea every morning.',exFa:'او هر صبح چای می‌نوشد.'},
 {en:'coffee',fa:'قهوه',pr:'کافی',ex:'I would like a cup of coffee.',exFa:'یک فنجان قهوه می‌خواهم.'},
 {en:'food',fa:'غذا',pr:'فود',ex:'The food is delicious.',exFa:'غذا خوشمزه است.'},
 {en:'house',fa:'خانه',pr:'هاوس',ex:'Their house is very big.',exFa:'خانه‌شان خیلی بزرگ است.'},
 {en:'car',fa:'ماشین',pr:'کار',ex:'My car is old.',exFa:'ماشین من قدیمی است.'},
 {en:'book',fa:'کتاب',pr:'بوک',ex:'This book is interesting.',exFa:'این کتاب جالب است.'},

function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

/* ---------- AUDIO ENGINE ---------- */
let voicesLoaded = false;
function loadVoices(){
  if(!('speechSynthesis' in window)) return [];
  const vs = window.speechSynthesis.getVoices();
  if(vs.length > 0) voicesLoaded = true;
  return vs;
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, rate){
  if(!('speechSynthesis' in window)){ toast('مرورگر شما از تلفظ پشتیبانی نمی‌کند'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate || state.rate;
  u.pitch = 1;
  const vs = window.speechSynthesis.getVoices();
  const v = vs.find(x=>x.lang==='en-US') || vs.find(x=>x.lang.startsWith('en-GB')) || vs.find(x=>x.lang.startsWith('en'));
  if(v) u.voice = v;
  window.speechSynthesis.speak(u);
}

let playAllToken = 0;
function playAll(lines, onDone){
  if(!('speechSynthesis' in window)){ toast('مرورگر شما از تلفظ پشتیبانی نمی‌کند'); return; }
  window.speechSynthesis.cancel();
  const token = ++playAllToken;
  let i = 0;
  function next(){
    if(token !== playAllToken) return;
    if(i >= lines.length){ onDone && onDone(); return; }
    const u = new SpeechSynthesisUtterance(lines[i].en);
    u.lang = 'en-US'; u.rate = state.rate;
    const vs = window.speechSynthesis.getVoices();
    const v = vs.find(x=>x.lang==='en-US') || vs.find(x=>x.lang.startsWith('en'));
    if(v) u.voice = v;
    u.onend = ()=>{ i++; setTimeout(()=>{ if(token===playAllToken) next(); }, 280); };
    u.onerror = ()=>{ i++; if(token===playAllToken) next(); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function stopAll(){ playAllToken++; if('speechSynthesis' in window) window.speechSynthesis.cancel(); }

function learnedList(lv){ return state.progress.learned[lv] || []; }
function isLearned(lv, en){ return learnedList(lv).includes(en); }
function toggleLearned(lv, en){
  const arr = learnedList(lv);
  const i = arr.indexOf(en);
  if(i>-1) arr.splice(i,1); else arr.push(en);
  state.progress.learned[lv] = arr;
  save();
}
function levelPct(lv){
  const total = VOCAB[lv].length;
  const done = learnedList(lv).length;
  return {done, total, pct: total? Math.round(done/total*100):0};
}
function w504Learned(){ return state.progress.w504; }
function isLearned504(en){ return state.progress.w504.includes(en); }
function toggle504(en){
  const arr = state.progress.w504;
  const i = arr.indexOf(en);
  if(i>-1) arr.splice(i,1); else arr.push(en);
  save();
}

function renderChrome(){
  $('#levels').innerHTML = LEVELS.map(l=>{
    const p = levelPct(l);
    return `<button class="chip ${state.level===l?'on':''}" data-lv="${l}" title="${LEVEL_NAMES[l]} — ${p.pct}%">${l}</button>`;
  }).join('');
  $('#tabs').innerHTML = TABS.map(t=>
    `<button data-view="${t.id}" class="${state.view===t.id?'on':''}"><span class="ic">${t.ic}</span>${t.label}</button>`
  ).join('');

  $('#levels').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{
    state.level = b.dataset.lv; saveLevel();
    state.cardIdx = 0; state.flipped = false; state.quiz = null; state.openAcc = -1;
    render();
  });
  $('#tabs').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
    stopAll();
    state.view = b.dataset.view;
    if(state.view==='cards'){ state.cardIdx=0; state.flipped=false; }
    render();
  });
}

/* ============================================================

   ============================================================ */
function render(){
  renderChrome();
  const v = state.view;
  if(v==='home') renderHome();
  else if(v==='vocab') renderVocab();
  else if(v==='w504') render504();
  else if(v==='convos') renderConvos();
  else if(v==='grammar') renderGrammar();
  else if(v==='cards') renderCards();
  else if(v==='quiz') renderQuiz();
  else if(v==='sounds') renderSounds();
  else if(v==='stats') renderStats();
}

    <button class="btn sm grade-easy" id="easyBtn">آسان (۳)</button>
    <button class="btn ghost sm" id="nextBtn">بعدی ›</button>
  </div>`;

  app.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{
    state.cardSource = b.dataset.src; state.cardIdx = 0; state.flipped = false; renderCards();
  });

  const fc = $('#fc');
  fc.onclick = (e)=>{ if(e.target.id!=='fcSpeak'){ state.flipped=!state.flipped; fc.classList.toggle('flip', state.flipped); } };
  $('#fcSpeak').onclick = e=>{ e.stopPropagation(); speak(w.en); };

  $('#prevBtn').onclick = ()=>{ state.cardIdx=(state.cardIdx-1+words.length)%words.length; state.flipped=false; renderCards(); };
  $('#nextBtn').onclick = ()=>{ state.cardIdx=(state.cardIdx+1)%words.length; state.flipped=false; renderCards(); };
  $('#againBtn').onclick = ()=>grade(0);
  $('#goodBtn').onclick  = ()=>grade(1);
  $('#easyBtn').onclick  = ()=>grade(2);

  function grade(kind){
    if(kind>0){
      if(source==='504'){ if(!isLearned504(w.en)) toggle504(w.en); }
      else { if(!isLearned(state.level, w.en)) toggleLearned(state.level, w.en); }
    }
    if(kind>0) speak(w.en);
    state.cardIdx = (state.cardIdx+1)%words.length;
    state.flipped = false;
    renderCards();
    if(kind>0) toast(kind===2?'آفرین! 👏':'خوب بود');
  }

  document.onkeydown = (e)=>{
    if(state.view!=='cards') return;
    if(e.code==='Space'){ e.preventDefault(); state.flipped=!state.flipped; fc.classList.toggle('flip', state.flipped); }
    else if(e.key==='1') grade(0);
    else if(e.key==='2') grade(1);
    else if(e.key==='3') grade(2);
    else if(e.key==='ArrowRight'){ state.cardIdx=(state.cardIdx-1+words.length)%words.length; state.flipped=false; renderCards(); }
    else if(e.key==='ArrowLeft'){ state.cardIdx=(state.cardIdx+1)%words.length; state.flipped=false; renderCards(); }
  };
}

/* ---------- QUIZ ---------- */
function buildQuiz(){
  const lv = state.level;
  const words = VOCAB[lv];
  const qs = [];

  shuffle(words).slice(0, Math.min(5, words.length)).forEach(w=>{
    const others = shuffle(words.filter(x=>x!==w)).slice(0,3);
    const opts = shuffle([w, ...others]).map(o=>({text:o.fa, lang:'fa'}));
    qs.push({type:'mc', prompt:'معنی این واژه چیست؟', word:w.en, lang:'en', speak:w.en, options:opts, answer:w.fa});
  });

  shuffle(words).slice(0, Math.min(4, words.length)).forEach(w=>{
    const others = shuffle(words.filter(x=>x!==w)).slice(0,3);
    const opts = shuffle([w, ...others]).map(o=>({text:o.en, lang:'en'}));
    qs.push({type:'mc', prompt:'معادل انگلیسی این واژه کدام است؟', word:w.fa, lang:'fa', options:opts, answer:w.en});
  });

  shuffle(words).filter(w=> w.ex.toLowerCase().includes(w.en.toLowerCase())).slice(0,3).forEach(w=>{
    const blanked = w.ex.replace(new RegExp(w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'), '_____');
    const others = shuffle(words.filter(x=>x!==w)).slice(0,3);
    const opts = shuffle([w, ...others]).map(o=>({text:o.en, lang:'en'}));
    qs.push({type:'mc', prompt:'جای خالی را پر کنید:', word:blanked, lang:'en', options:opts, answer:w.en});
  });

  // 504 words mixed in
  shuffle(W504).slice(0,3).forEach(w=>{
    const others = shuffle(W504.filter(x=>x!==w)).slice(0,3);
    const opts = shuffle([w, ...others]).map(o=>({text:o.fa, lang:'fa'}));
    qs.push({type:'mc', prompt:'معنی این واژهٔ ۵۰۴ چیست؟', word:w.en, lang:'en', speak:w.en, options:opts, answer:w.fa});
  });

  shuffle(GRAMMAR_Q[lv]).slice(0,4).forEach(g=>{
    const opts = shuffle(g.o).map(o=>({text:o, lang:'en'}));
    qs.push({type:'mc', prompt:'گزینهٔ درست را انتخاب کنید:', word:g.q, lang:'en', options:opts, answer:g.a});
  });

  return shuffle(qs).slice(0,14);
}

function renderQuiz(){
  if(!state.quiz){
    app.innerHTML = `
    <div class="card" style="text-align:center;padding:38px 24px">
      <div style="font-size:44px;margin-bottom:10px">✍️</div>
      <h2 class="sec">آزمون سطح ${state.level}</h2>
      <p class="sub">۱۴ سؤال ترکیبی: واژگان سطح، ۵۰۴ واژه، جای خالی و گرامر</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
        <button class="btn" id="startQuiz">شروع آزمون</button>
        <button class="btn ghost" id="startQuizShort">آزمون کوتاه (۷ سؤال)</button>
      </div>
      ${state.progress.best[state.level]!=null ? `<p style="margin-top:18px;color:var(--muted);font-size:13.5px">بهترین نمرهٔ شما در این سطح: <b style="color:var(--accent)">${state.progress.best[state.level]}%</b></p>`:''}
    </div>`;
    $('#startQuiz').onclick = ()=>{ state.quiz = {qs:buildQuiz(), i:0, score:0, answered:false, picked:null}; renderQuiz(); };
    $('#startQuizShort').onclick = ()=>{ state.quiz = {qs:buildQuiz().slice(0,7), i:0, score:0, answered:false, picked:null}; renderQuiz(); };
    return;
  }

  const q = state.quiz;
  if(q.i >= q.qs.length){ renderResult(); return; }

  const cur = q.qs[q.i];
  const pct = q.i/q.qs.length*100;

  app.innerHTML = `
  <div class="progress-line"><i style="width:${pct}%"></i></div>
  <div class="q-head">
    <span>سؤال ${q.i+1} از ${q.qs.length}</span>
    <span>امتیاز: <b style="color:var(--accent);font-family:Inter">${q.score}</b></span>
  </div>
  <div class="card">
    <p style="color:var(--muted);font-size:13px;font-weight:600;margin-bottom:8px">${esc(cur.prompt)}</p>
    <div class="q-text">
      ${cur.lang==='en'
        ? `<span class="en" style="font-size:${cur.type==='mc'&&cur.word.length>40?'16px':'22px'}">${esc(cur.word)}</span>`
        : `<span>${esc(cur.word)}</span>`}
      ${cur.speak? `<button class="spk sm" data-say="${esc(cur.speak)}" style="margin-inline-start:10px;vertical-align:middle">🔊</button>`:''}
    </div>
    <div id="opts">
      ${cur.options.map((o,idx)=>`
        <button class="opt" data-opt="${idx}">
          <span class="k">${'ABCD'[idx]}</span>
          <span class="${o.lang==='en'?'en':''}">${esc(o.text)}</span>
        </button>`).join('')}
    </div>
    <div id="fb"></div>
  </div>`;

  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));

  const btns = [...app.querySelectorAll('.opt')];
  btns.forEach(b=>{
    b.onclick = ()=>{
      if(state.quiz.answered) return;
      state.quiz.answered = true;
      const idx = +b.dataset.opt;
      const picked = cur.options[idx].text;
      const correct = picked === cur.answer;

      btns.forEach((bb,k)=>{
        bb.classList.add('locked');
        const t = cur.options[k].text;
        if(t === cur.answer) bb.classList.add('correct');
        else if(k===idx) bb.classList.add('wrong');
      });

      if(correct){ state.quiz.score++; }
      if(cur.answer && /^[a-zA-Z'’\- ]+$/.test(cur.answer)) speak(cur.answer);

      $('#fb').innerHTML = correct
        ? `<div class="feedback ok">✅ آفرین! پاسخ درست بود.</div>
           <div style="margin-top:14px;text-align:left"><button class="btn" id="nextQ">سؤال بعدی →</button></div>`
        : `<div class="feedback no">❌ نادرست. پاسخ درست: <span class="en" style="margin-inline-start:6px">${esc(cur.answer)}</span></div>
           <div style="margin-top:14px;text-align:left"><button class="btn" id="nextQ">سؤال بعدی →</button></div>`;

      $('#nextQ').onclick = ()=>{
        state.quiz.i++; state.quiz.answered=false;
        renderQuiz();
      };
    };
  });
}

function renderResult(){
  const q = state.quiz;
  const pct = Math.round(q.score/q.qs.length*100);
  const prev = state.progress.best[state.level];
  if(prev==null || pct>prev){ state.progress.best[state.level] = pct; save(); }

  let msg, emoji;
  if(pct>=90){ msg='فوق‌العاده! تسلط شما چشمگیر است.'; emoji='🏆'; }
  else if(pct>=70){ msg='خیلی خوب! کمی تمرین بیشتر و عالی می‌شوید.'; emoji='👏'; }
  else if(pct>=50){ msg='قابل قبول. درس‌ها را مرور کنید.'; emoji='📖'; }
  else { msg='نیاز به تمرین بیشتری دارید. ناامید نشوید!'; emoji='💪'; }

  app.innerHTML = `
  <div class="card result-hero">
    <div style="font-size:46px;margin-bottom:6px">${emoji}</div>
    <div class="score">${pct}%</div>
    <div class="msg">${msg}</div>
    <p style="color:var(--muted);font-size:14px">${q.score} پاسخ درست از ${q.qs.length} سؤال</p>
    ${prev!=null ? `<p style="color:var(--muted);font-size:13px;margin-top:4px">بهترین نمرهٔ قبلی: ${prev}%</p>`:''}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px">
      <button class="btn" id="retry">آزمون دوباره</button>
      <button class="btn ghost" id="toVocab">مرور واژگان</button>
      <button class="btn ghost" id="toGrammar">مرور گرامر</button>
    </div>
  </div>`;
  $('#retry').onclick = ()=>{ state.quiz={qs:buildQuiz(),i:0,score:0,answered:false,picked:null}; renderQuiz(); };
  $('#toVocab').onclick = ()=>{ state.view='vocab'; render(); };
  $('#toGrammar').onclick = ()=>{ state.view='grammar'; render(); };
}

/* ---------- SOUNDS ---------- */
function renderSounds(){
  app.innerHTML = `
  <div class="card" style="padding:16px 18px">
    <h2 class="sec" style="margin:0">آزمایشگاه تلفظ 🔊</h2>
    <p class="sub" style="margin:6px 0 0">صداهایی که در فارسی وجود ندارند یا فرقشان را نمی‌شنویم — بزرگ‌ترین منبع «لهجهٔ فارسی» در انگلیسی. روی هر کلمه بزنید تا تلفظش را بشنوید.</p>
  </div>
  ${SOUNDS.map((s,i)=>`
    <div class="acc snd ${state.soundsOpen===i?'open':''}" data-snd="${i}">
      <button class="acc-h">
        <span class="ipa">${esc(s.ipa)}</span>
        <span style="font-size:15px">${esc(s.title)}</span>
        <span class="arw" style="margin-inline-start:auto">▼</span>
      </button>
      <div class="acc-b">
        <div class="acc-inner">
          <p><b>چرا برای فارسی‌زبانان سخت است؟</b> ${esc(s.fa)}</p>
          <div class="ok-box">💡 <b>راه‌حل:</b> ${esc(s.tip)}</div>
          <p style="margin-top:14px"><b>جفت‌های کمینه — روی هر کلمه بزنید:</b></p>
          <div class="pairs">
            ${s.pairs.map(p=>`
              <div class="pair">
                <span class="w" data-say="${esc(p.a)}">${esc(p.a)}</span>
                <span class="vs">≠</span>
                <span class="w" data-say="${esc(p.b)}" style="color:var(--muted)">${esc(p.b)}</span>
                <span class="gloss">${esc(p.g)}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`).join('')}

  <div class="card">
    <h2 class="sec">📌 نکتهٔ کلی برای فارسی‌زبانان</h2>
    <p style="font-size:14px;margin-top:8px">فارسی زبانی است که هر هجا را کامل و واضح تلفظ می‌کند و ساختار خوشه‌ای در آغاز کلمه ندارد. انگلیسی برعکس، هجاها را می‌خورد و صداها را در هم می‌آمیزد. بزرگ‌ترین کلید بهبود لهجه، تمرین <b>استرس کلمه</b> و <b>واکهٔ خنثی /ə/</b> است — نه فقط تلفظ تکی صداها.</p>
  </div>`;

  app.querySelectorAll('[data-snd]').forEach(el=>{
    el.querySelector('.acc-h').onclick = ()=>{
      const i = +el.dataset.snd;
      state.soundsOpen = state.soundsOpen===i ? -1 : i;
      renderSounds();
    };
  });
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick = e=>{ e.stopPropagation(); speak(b.dataset.say); });
}

/* ---------- STATS ---------- */
function renderStats(){
  const totalWords = LEVELS.reduce((s,l)=>s+VOCAB[l].length,0);
  const totalLearned = LEVELS.reduce((s,l)=>s+learnedList(l).length,0);
  const overall = Math.round(totalLearned/totalWords*100);
  const quizzes = LEVELS.filter(l=>state.progress.best[l]!=null).length;
  const w504pct = Math.round(w504Learned().length/504*100);

  app.innerHTML = `
  <div class="card" style="padding:16px 18px">
    <h2 class="sec" style="margin:0">پیشرفت شما 📊</h2>
    <p class="sub" style="margin:6px 0 0">همهٔ داده‌ها در همین مرورگر ذخیره می‌شوند</p>
  </div>

  <div class="stat-grid">
    <div class="stat"><b>${overall}%</b><span>پیشرفت واژگان سطحی</span></div>
    <div class="stat"><b>${w504pct}%</b><span>پیشرفت ۵۰۴ واژه (${w504Learned().length}/504)</span></div>
    <div class="stat"><b>${totalLearned}</b><span>واژهٔ سطحی از ${totalWords}</span></div>
    <div class="stat"><b>${quizzes}/${LEVELS.length}</b><span>سطح آزمون‌داده‌شده</span></div>
  </div>

  <div class="card">
    <h2 class="sec">تفکیک بر اساس سطح</h2>
    <p class="sub">درصد واژگانی که «آموختم» علامت زده‌اید</p>
    <div class="pgrid">
      ${LEVELS.map(l=>{
        const p = levelPct(l);
        const b = state.progress.best[l];
        return `<div class="prow">
          <span class="lbl">${l}</span>
          <div class="bar"><i style="width:${p.pct}%"></i></div>
          <span class="val">${p.pct}%</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin:-6px 0 10px 47px">
          ${LEVEL_NAMES[l]} — ${p.done}/${p.total} واژه · ${b!=null?`بهترین آزمون: <b style="color:var(--accent);font-family:Inter">${b}%</b>`:'آزمون نداده‌اید'}
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="card">
    <h2 class="sec">⭐ ۵۰۴ واژهٔ ضروری</h2>
    <div class="bar"><i style="width:${w504pct}%"></i></div>
    <p style="font-size:13.5px;color:var(--muted);margin-top:10px">${w504Learned().length} از ۵۰۴ واژه آموخته شده — ${504-w504Learned().length} واژه باقی مانده است.</p>
  </div>

  <div class="card">
    <h2 class="sec">توصیهٔ بعدی</h2>
    <p style="font-size:14px;margin-top:8px">${nextAdvice()}</p>
    <div style="margin-top:14px"><button class="btn ghost" id="resetBtn">پاک کردن همهٔ پیشرفت</button></div>
  </div>`;

  $('#resetBtn').onclick = ()=>{
    if(confirm('مطمئنید؟ تمام پیشرفت شما پاک خواهد شد.')){
      state.progress = {learned:{}, best:{}, w504:[]};
      LEVELS.forEach(l=>state.progress.learned[l]=[]);
      save(); render(); toast('پیشرفت پاک شد');
    }
  };
}

function nextAdvice(){
  const w504pct = w504Learned().length/504;
  for(const l of LEVELS){
    const p = levelPct(l);
    if(p.pct < 60) return `سطح <b>${l} (${LEVEL_NAMES[l]})</b> را کامل کنید — ${p.total-p.done} واژهٔ باقی‌مانده دارید. پس از رسیدن به ۶۰٪، آزمون این سطح را بدهید.`;
    if(state.progress.best[l]==null) return `واژگان سطح <b>${l}</b> را خوب یاد گرفته‌اید! حالا یک <b>آزمون</b> از این سطح بدهید تا گرامرتان هم سنجیده شود.`;
  }
  if(w504pct < 0.7) return `واژگان سطحی را تمام کرده‌اید. حالا روی <b>۵۰۴ واژهٔ ضروری</b> تمرکز کنید — هنوز ${504-w504Learned().length} واژه باقی مانده است.`;
  return `شما در همهٔ سطوح و ۵۰۴ واژه پیشرفت خوبی داشته‌اید. 🎉 حالا روی <b>مهارت‌های تولیدی</b> تمرکز کنید: نوشتن متن‌های کوتاه، توصیف تصاویر به انگلیسی، و صحبت کردن روزانه ۵ دقیقه با خودتان.`;
}

/* ============================================================
   12. INIT
   ============================================================ */
if(!state.cardSource) state.cardSource = 'vocab';
render();
</script>
